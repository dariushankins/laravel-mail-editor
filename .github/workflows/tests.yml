name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite
          coverage: none
      - name: Select framework and Testbench
        run: |
          if [ "${{ matrix.laravel }}" = "13" ]; then
            composer require --dev 'orchestra/testbench:^11.0' --no-update
          else
            composer require --dev 'orchestra/testbench:^10.0' --no-update
          fi
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer update --prefer-dist --no-interaction
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- public
      - run: npx playwright install --with-deps chromium
      - run: npm test
